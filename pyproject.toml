[project]
name = "article-oct-diabetic-neuropathy"
version = "0.1.0"
description = "Research project on OCT for early diagnostics of diabetic neuropathy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "hydra-core>=1.3.2",
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "omegaconf>=2.3.0",
    "opencv-python>=4.13.0.92",
    "openpyxl>=3.1.5",
    "pandas>=3.0.1",
    "pydicom>=3.0.1",
    "scikit-image>=0.26.0",
    "segmentation-models-pytorch>=0.5.0",
    "simpleitk>=2.5.3",
    "torch>=2.10.0",
    "tqdm>=4.67.3",
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.0",
    "jupyter>=1.0",
]
