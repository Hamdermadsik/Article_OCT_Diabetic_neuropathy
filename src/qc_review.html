<html lang="da">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIP-kvalitetskontrol</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#212825;background:#f6f7f6;font-size:14px;letter-spacing:0}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,select{cursor:pointer}button{border:1px solid #cdd3ce;background:white;color:inherit;border-radius:5px;padding:9px 13px;min-height:38px}button:hover{background:#edf1ee}button:disabled{opacity:.45;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #53a280;outline-offset:2px}
header{min-height:70px;padding:14px 24px;border-bottom:1px solid #dce1dc;background:white;display:flex;align-items:center;justify-content:space-between;gap:16px}h1{font-size:20px;margin:0;font-weight:650}h2{font-size:14px;margin:0 0 15px}.muted{color:#68736c;font-size:12px}.header-right{display:flex;align-items:center;gap:16px}a{color:#276e50}#progress{width:150px;height:5px;accent-color:#29825b}#notice{background:#fff3ce;padding:12px 24px;display:none}#error{color:#92332e;background:#ffe9e6;padding:12px 24px;display:none;white-space:pre-wrap}
.workspace{display:grid;grid-template-columns:225px minmax(0,1fr) 280px;min-height:calc(100vh - 71px)}nav{border-right:1px solid #dce1dc;background:#fafbfa;padding:18px 12px;min-width:0}.filter{width:100%;margin-bottom:12px;padding:8px;border:1px solid #cdd3ce;border-radius:4px}.item-list{max-height:calc(100vh - 180px);overflow:auto}.scan{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:3px;text-align:left;background:transparent;border:1px solid transparent;font-size:13px}.scan.active{background:#e2eee6;border-color:#b6cfc0}.scan-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.dot{width:8px;height:8px;background:#c5cbc6;border-radius:50%;flex:none}.dot.use{background:#29825b}.dot.discard{background:#b65349}.dot.unsure{background:#c69b28}.count{font-size:12px;color:#657168}
main{padding:20px;min-width:0}.scan-heading{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:15px}.scan-heading h2{font-size:17px;margin:0;overflow-wrap:anywhere}#status{font-size:12px;margin-top:5px;color:#51675a}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:5px;padding:9px 0;border-top:1px solid #dce1dc;border-bottom:1px solid #dce1dc;margin-bottom:14px}.icon{padding:6px;width:36px;min-height:34px;font-size:19px}.toolbar select{padding:7px;border:1px solid #cdd3ce;border-radius:4px;background:white;max-width:100%}.toolbar .spacer{flex:1}.viewport{height:calc(100vh - 280px);min-height:320px;overflow:auto;background:#181c1a;border:1px solid #ccd3ce;display:flex;align-items:flex-start;justify-content:flex-start}.image-wrap{margin:auto;flex:none;line-height:0}#mip{display:block;image-rendering:pixelated;max-width:none}.image-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:9px}.pager{display:flex;gap:6px;align-items:center}.empty{padding:30px;color:#68736c;text-align:center}.loading{opacity:.45;pointer-events:none}
aside{padding:22px 20px;background:white;border-left:1px solid #dce1dc;min-width:0}label.field{display:block;font-weight:600;font-size:13px;margin-bottom:8px}.reviewer{padding-bottom:18px;border-bottom:1px solid #e2e6e2;margin-bottom:22px}fieldset{border:0;margin:0;padding:0}legend{font-weight:600;font-size:13px;margin-bottom:10px}.check{display:flex;align-items:center;gap:8px;margin-bottom:11px;font-size:13px}input[type=checkbox]{accent-color:#29825b;width:15px;height:15px}textarea{width:100%;resize:vertical;min-height:105px;padding:9px;border:1px solid #cdd3ce;border-radius:4px;margin-bottom:16px}.decision{display:flex;flex-direction:column;gap:8px}.decision button{text-align:left;font-weight:600;padding:12px}.use-button{color:#16653e;border-color:#9abcaa;background:#f0f8f3}.discard-button{color:#9e3c34;border-color:#d7b3ae;background:#fff8f7}.unsure-button{color:#7a5b11;border-color:#d6c48f;background:#fffdf5}#save-state{min-height:34px;padding-top:12px;font-size:12px;color:#637268}#reset{font-size:12px;margin-top:12px;background:none;border:0;padding:0;min-height:24px;color:#657168}.footer-path{overflow-wrap:anywhere;font-size:11px;color:#7b857d;margin-top:22px}.unsaved{color:#99671b!important}
@media(max-width:1050px){.workspace{grid-template-columns:175px minmax(0,1fr) 240px}main{padding:14px}aside{padding:18px 14px}header{padding:12px 16px}#progress{display:none}}
@media(max-width:760px){header{align-items:flex-start;flex-wrap:wrap}.header-right{gap:12px}.workspace{grid-template-columns:minmax(0,1fr)}nav{border-right:0;border-bottom:1px solid #dce1dc;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}.filter{width:145px;flex:none;margin:0}.item-list{display:flex;overflow:auto;max-height:80px}.scan{width:135px;flex:none;margin:0}.scan-label{white-space:nowrap}main{padding:14px}.viewport{height:45vh;min-height:250px}aside{border-left:0;border-top:1px solid #dce1dc;padding:18px}.reviewer{display:none}.decision{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}.decision button{text-align:center;padding:10px 5px;font-size:13px}fieldset{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}textarea{min-height:65px}.footer-path{margin-top:12px}}
.viewport{height:clamp(300px,45vh,470px)}
.scan-heading>div:first-child{min-width:0;flex:1}.pager{flex:none}
.decision .use-button{background:#087d38;border-color:#087d38;color:#fff}
.decision .use-button:hover{background:#05632c;border-color:#05632c}
.decision .discard-button{background:#d52124;border-color:#d52124;color:#fff}
.decision .discard-button:hover{background:#b31518;border-color:#b31518}
.decision .unsure-button{background:#ffd400;border-color:#d4ad00;color:#292300}
.decision .unsure-button:hover{background:#e8bf00;border-color:#b89800}
#reset{color:#a63830}#reset:hover{color:#7d241e;text-decoration:underline}
.scan.status-use{background:#dcefe2;border-color:#b3d4bf;color:#205b3a}
.scan.status-discard{background:#f9e0dd;border-color:#e3b6b0;color:#873d35}
.scan.status-unsure{background:#fff0c2;border-color:#e0cd8b;color:#705711}
.scan.status-unreviewed{background:#f0f2f0;border-color:#dce1dc}
.scan.active{border-color:#40554a;box-shadow:inset 3px 0 #40554a}
.bscan-section{margin-top:20px;padding-top:16px;border-top:1px solid #dce1dc}
.bscan-header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.bscan-header h2{margin:0;font-size:14px}.bscan-header .check{margin:0;white-space:nowrap}
.bscan-view{display:flex;align-items:flex-start;height:290px;overflow:auto;background:#181c1a;border:1px solid #ccd3ce}
.bscan-stack{display:block;position:relative;flex:none;margin:auto;line-height:0}
.viewport,.bscan-view{cursor:default;overscroll-behavior:contain;overflow:hidden}
#mip,#bscan-link{cursor:grab}
.image-open{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;border:1px solid #cdd3ce;border-radius:5px;background:white;color:inherit}
.viewport.panning,.bscan-view.panning{cursor:grabbing;user-select:none}
.viewport img,.bscan-view img{-webkit-user-drag:none;user-select:none}
#bscan,#bscan-overlay{display:block;width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
#bscan-overlay{position:absolute;inset:0;pointer-events:none}
.dej-fade{display:flex;align-items:center;gap:9px;font-size:13px;max-width:100%}
.dej-fade input{width:145px;min-width:65px;accent-color:#29825b}.dej-fade output{width:42px;text-align:right;flex:none}
#bscan-empty{padding:25px 12px;color:#68736c;border:1px solid #dce1dc;font-size:13px}
#bscan-meta{margin-top:7px}
@media(max-width:760px){.viewport{height:40vh;min-height:250px}.bscan-view{height:190px}}
</style>
</head>
<body>
<header><div><h1>MIP-kvalitetskontrol</h1><div class="muted" id="cohort"></div></div><div class="header-right"><div><span id="counts"></span><div class="muted" id="generation-counts"></div></div><progress id="progress" max="1" value="0"></progress><a href="/api/export" download>Eksportér CSV</a></div></header>
<div id="notice" role="status"></div><div id="error" role="alert"></div>
<div class="workspace">
<nav aria-label="Billeder"><select class="filter" id="filter" aria-label="Filtrér vurderinger"><option value="all">Alle billeder</option><option value="unreviewed">Ikke vurderet</option><option value="use">Brug</option><option value="discard">Kassér</option><option value="unsure">Måske / ved ikke</option><option value="segmentation">Forkert DEJ</option></select><div id="list" class="item-list"></div></nav>
<main><div class="scan-heading"><div><h2 id="name">Indlæser…</h2><div id="status"></div></div><div class="pager"><button class="icon" id="previous" title="Forrige billede" aria-label="Forrige billede">&larr;</button><button class="icon" id="next" title="Næste billede" aria-label="Næste billede">&rarr;</button></div></div>
<div class="toolbar"><button class="icon" id="zoom-out" title="Zoom ud" aria-label="Zoom ud">&minus;</button><span id="zoom-label" class="muted">100 %</span><button class="icon" id="zoom-in" title="Zoom ind" aria-label="Zoom ind">+</button><button class="icon" id="fit" title="Tilpas billedet" aria-label="Tilpas billedet">&#x2922;</button><span class="spacer"></span><span class="muted" id="range"></span></div>
<div id="viewport" class="viewport"><div class="image-wrap"><img id="mip" alt="MIP til kvalitetsvurdering"></div></div><div class="image-meta muted"><span id="dimensions"></span><span id="valid"></span></div>
<section class="bscan-section" aria-label="B-scan til segmenteringskontrol">
 <div class="bscan-header"><h2>B-scan · Segmentering</h2><label class="check" title="Vis scannerens røde OCTA-overlay"><input id="octa-visible" type="checkbox" checked>OCTA</label><label class="dej-fade" for="dej-opacity">DEJ<input id="dej-opacity" type="range" min="0" max="100" step="1" value="50" aria-label="DEJ synlighed"><output id="dej-opacity-value" for="dej-opacity">50 %</output></label></div>
 <div class="toolbar"><button class="icon" id="bscan-zoom-out" title="Zoom ud i B-scan" aria-label="Zoom ud i B-scan">&minus;</button><span id="bscan-zoom-label" class="muted">100 %</span><button class="icon" id="bscan-zoom-in" title="Zoom ind i B-scan" aria-label="Zoom ind i B-scan">+</button><button class="icon" id="bscan-fit" title="Tilpas B-scan" aria-label="Tilpas B-scan">&#x2922;</button><a id="bscan-open" class="icon image-open" target="_blank" rel="noopener" title="Åbn B-scan i fuld størrelse" aria-label="Åbn B-scan i fuld størrelse">&#8599;</a></div>
 <div id="bscan-viewport" class="bscan-view"><div id="bscan-link" class="bscan-stack"><img id="bscan" alt="Originalt midterste B-scan"><img id="bscan-overlay" alt="" aria-hidden="true"></div></div>
 <div id="bscan-empty" hidden>B-scan er ikke tilgængeligt for dette scan.</div>
 <div id="bscan-meta" class="muted"></div>
</section>
</main>
<aside><h2>Vurdering</h2>
<div id="reasons"><fieldset><legend>Årsag (valgfri)</legend>
 <label class="check" title="Kornet baggrund eller svag adskillelse mellem relevant signal og støj. Lavt OCTA-signal alene er ikke en kvalitetsfejl."><input type="checkbox" value="noise">Støj / lavt SNR</label>
 <label class="check" title="Mistænkte bevægelsesrelaterede striber, forskydninger, gentagelser eller strækninger."><input type="checkbox" value="motion">Bevægelsesartefakter</label>
 <label class="check" title="Teknisk signaludfald eller skyggeområder, der skjuler vævet eller det relevante lag."><input type="checkbox" value="signal_loss">Signaltab / skygger</label>
 <label class="check" title="Detaljer fremstår udviskede eller utilstrækkeligt skarpe; årsagen kan ikke nødvendigvis fastslås visuelt."><input type="checkbox" value="blur">Sløring / lav skarphed</label>
 <label class="check" title="Mistanke om klippede eller mættede billedværdier med tab af detaljer. Lyse pixels alene er ikke bevis på overstyring."><input type="checkbox" value="clipping">Mætning / klipning</label>
 <label class="check"><input type="checkbox" value="other">Andet</label>
</fieldset>
<fieldset style="border-top:1px solid #e2e6e2;margin-top:8px;padding-top:16px;margin-bottom:16px"><legend>DEJ segmenteringsfejl</legend>
 <label class="check" title="Den beregnede DEJ eller det udtrukne lag ligger forkert i forhold til den vurderede anatomi."><input type="checkbox" value="segmentation">Forkert DEJ-segmentering</label>
</fieldset></div>
<label class="field" for="note">Note (valgfri)</label><textarea id="note" maxlength="5000"></textarea>
<div class="decision"><button class="use-button" data-status="use">✓ Brug</button><button class="discard-button" data-status="discard">× Kassér</button><button class="unsure-button" data-status="unsure">? Måske / ved ikke</button></div>
<div id="save-state" role="status" aria-live="polite"></div><button id="reset">Nulstil vurdering</button><div class="footer-path" id="results-path"></div>
</aside></div>
<script>
const config=/*APP_CONFIG*/;
const $=id=>document.getElementById(id);
const labels={use:'Brug',discard:'Kassér',unsure:'Måske / ved ikke',unreviewed:'Ikke vurderet'};
let state, current, busy=false, dirty=false, zoom=1, bscanZoom=1, imageReady=false, bscanReady=true, activeFilter='all';
function error(message){$('error').textContent=message;$('error').style.display=message?'block':'none'}
function statusOf(item){return state.reviews[item.id]?.status||'unreviewed'}
function matchesFilter(item,filter=$('filter').value){
 if(filter==='segmentation')return (state.reviews[item.id]?.reasons||[]).includes('segmentation');
 return filter==='all'||statusOf(item)===filter;
}
function visible(){return state.items.filter(i=>matchesFilter(i))}
function title(item){return config.showNames?item.filename:`Scan ${String(state.items.indexOf(item)+1).padStart(4,'0')}`}
function renderList(){const list=$('list'),top=list.scrollTop,left=list.scrollLeft;list.replaceChildren();for(const item of visible()){const b=document.createElement('button');b.className='scan status-'+statusOf(item)+(item.id===current?.id?' active':'');b.setAttribute('aria-current',item.id===current?.id?'true':'false');const dot=document.createElement('span');dot.className='dot '+statusOf(item);const name=document.createElement('span');name.className='scan-label';name.textContent=title(item);const mark=document.createElement('span');mark.className='count';mark.textContent=statusOf(item)==='unreviewed'?'':statusOf(item)==='use'?'✓':statusOf(item)==='discard'?'×':'?';b.append(dot,name,mark);b.title=labels[statusOf(item)];b.onclick=()=>select(item);b.disabled=busy;list.append(b)}if(!list.children.length){const e=document.createElement('div');e.className='empty';e.textContent='Ingen billeder';list.append(e)}list.scrollTop=top;list.scrollLeft=left;const done=state.items.filter(i=>statusOf(i)!=='unreviewed').length;$('counts').textContent=`${done} / ${state.items.length} vurderet`;$('progress').max=state.items.length;$('progress').value=done;const rows=visible();const at=rows.findIndex(i=>i.id===current?.id);$('previous').disabled=busy||at<=0;$('next').disabled=busy||at<0||at>=rows.length-1}
function revealCurrent(){
 const list=$('list'),active=list.querySelector('[aria-current="true"]');if(!active)return;
 const row=active.getBoundingClientRect(),box=list.getBoundingClientRect();
 if(row.top<box.top)list.scrollTop-=box.top-row.top;else if(row.bottom>box.bottom)list.scrollTop+=row.bottom-box.bottom;
 if(row.left<box.left)list.scrollLeft-=box.left-row.left;else if(row.right>box.right)list.scrollLeft+=row.right-box.right;
}
function confirmLeave(){return !dirty||window.confirm('Noten eller årsagen er ikke gemt. Forlad billedet?')}
function select(item,force=false){
 if(busy||(!force&&!confirmLeave()))return;current=item;dirty=false;imageReady=false;error('');
 mipNavigation.reset();
 if(!item){
  $('name').textContent='Ingen billeder i dette udvalg';$('status').textContent='';$('note').value='';
  for(const check of $('reasons').querySelectorAll('input'))check.checked=false;
  $('save-state').textContent='';$('save-state').className='';$('dimensions').textContent='';$('valid').textContent='';
  $('mip').removeAttribute('src');$('viewport').classList.remove('loading');updateBscan();setButtons();return;
 }
 $('name').textContent=item.filename;const record=state.reviews[item.id];$('status').textContent=labels[statusOf(item)];
 $('note').value=record?.note||'';for(const check of $('reasons').querySelectorAll('input'))check.checked=(record?.reasons||[]).includes(check.value);
 $('save-state').textContent=record?'Gemt '+new Date(record.reviewed_at).toLocaleString('da-DK'):'';$('save-state').className='';
 $('range').textContent='';$('dimensions').textContent=`${item.width} × ${item.height} pixels`;$('valid').textContent='';
 $('cohort').textContent='QC-MIP · DEJ −5 til +15 px · Vurdering af hele scannet';
 updateBscan();
 $('viewport').classList.add('loading');$('mip').src='/api/image/'+item.id;zoom=1;setButtons();revealCurrent();
}
function updateBscan(){
 const info=current?.bscan;
 bscanNavigation.reset();$('bscan-open').style.display=info?'inline-flex':'none';
 bscanZoom=1;$('bscan-zoom-label').textContent='100 %';
 $('bscan-viewport').scrollTop=0;$('bscan-viewport').scrollLeft=0;
 $('bscan-viewport').style.display=info?'flex':'none';
 $('bscan-link').style.display=info?'block':'none';$('bscan-empty').hidden=!!info;$('dej-opacity').disabled=!info;$('octa-visible').disabled=!info;
 $('bscan-meta').textContent=info?`B-scan ${info.index} / ${info.num_frames-1} · Midterste tværsnit${info.recomputed?' · DEJ genberegnet til visning':''}`:'';
 if(!info){bscanReady=true;$('bscan').removeAttribute('src');$('bscan-overlay').removeAttribute('src');return}
 loadBscanImages();
}
function loadBscanImages(){
 if(!current?.bscan)return;
 bscanReady=false;$('bscan-link').classList.add('loading');setButtons();
 const octa=$('octa-visible').checked?'1':'0';
 $('bscan').src=`/api/bscan/${current.id}?overlay=0&octa=${octa}`;
 $('bscan-overlay').src=`/api/bscan/${current.id}?overlay=1&octa=${octa}`;
 fadeDej();
}
$('octa-visible').onchange=loadBscanImages;
function fadeDej(){
 const value=Number($('dej-opacity').value);
 $('bscan-overlay').style.opacity=String(value/100);$('dej-opacity-value').textContent=`${value} %`;
 if(current?.bscan)$('bscan-open').href=`/api/bscan/${current.id}?opacity=${value/100}&octa=${$('octa-visible').checked?'1':'0'}`;
}
$('dej-opacity').oninput=fadeDej;
function fitBscan(){
 if(!current?.bscan||!bscanReady)return;
 const box=$('bscan-viewport'),img=$('bscan');
 const scale=Math.min((box.clientWidth-4)/img.naturalWidth,(box.clientHeight-4)/img.naturalHeight);
 $('bscan-link').style.width=Math.max(1,img.naturalWidth*scale*bscanZoom)+'px';
 $('bscan-link').style.height=Math.max(1,img.naturalHeight*scale*bscanZoom)+'px';
 $('bscan-zoom-label').textContent=Math.round(bscanZoom*100)+' %';
 bscanNavigation.constrain();
 syncZoomControls();
}
$('bscan-zoom-in').onclick=()=>{bscanZoom=Math.min(8,bscanZoom*1.4);fitBscan()};
$('bscan-zoom-out').onclick=()=>{bscanZoom=Math.max(1,bscanZoom/1.4);fitBscan()};
$('bscan-fit').onclick=()=>{bscanZoom=1;bscanNavigation.reset();fitBscan()};
window.addEventListener('resize',fitBscan);
function bscanLoaded(){bscanReady=[$('bscan'),$('bscan-overlay')].every(img=>img.complete&&img.naturalWidth>0);if(bscanReady){$('bscan-link').classList.remove('loading');fitBscan()}setButtons()}
for(const img of [$('bscan'),$('bscan-overlay')]){
 img.onload=bscanLoaded;
 img.onerror=()=>{if(!current?.bscan)return;bscanReady=true;$('bscan-link').style.display='none';$('bscan-viewport').style.display='none';$('bscan-empty').hidden=false;$('bscan-empty').textContent='B-scan kunne ikke indlæses.';setButtons()};
}
function fit(){if(!current||!imageReady)return;const box=$('viewport');const baseW=current.width,baseH=current.height;const scale=Math.min((box.clientWidth-4)/baseW,(box.clientHeight-4)/baseH);$('mip').style.width=Math.max(1,baseW*scale*zoom)+'px';$('mip').style.height=Math.max(1,baseH*scale*zoom)+'px';$('zoom-label').textContent=Math.round(zoom*100)+' %';mipNavigation.constrain();syncZoomControls()}
function syncZoomControls(){
 $('zoom-out').disabled=!imageReady||zoom<=1;$('zoom-in').disabled=!imageReady||zoom>=8;
 const missing=!current?.bscan||!bscanReady||!$('bscan').naturalWidth;
 $('bscan-zoom-out').disabled=missing||bscanZoom<=1;$('bscan-zoom-in').disabled=missing||bscanZoom>=8;$('bscan-fit').disabled=missing;
}
function mouseNavigation(box,image,getZoom,setZoom,resize,ready){
 let drag=null,suppressClick=false,panX=0,panY=0;
 function overImage(event){const r=image.getBoundingClientRect();return event.clientX>=r.left&&event.clientX<=r.right&&event.clientY>=r.top&&event.clientY<=r.bottom}
 function translate(){
  image.style.transform=`translate(${panX}px,${panY}px)`;
  const r=image.getBoundingClientRect(),v=box.getBoundingClientRect();
  const left=v.left+box.clientLeft,top=v.top+box.clientTop;
  const x=r.width<=box.clientWidth?left+(box.clientWidth-r.width)/2:Math.min(left,Math.max(left+box.clientWidth-r.width,r.left));
  const y=r.height<=box.clientHeight?top+(box.clientHeight-r.height)/2:Math.min(top,Math.max(top+box.clientHeight-r.height,r.top));
  panX+=x-r.left;panY+=y-r.top;
  image.style.transform=`translate(${panX}px,${panY}px)`;
  image.style.cursor=getZoom()>1?'grab':'default';
 }
 box.addEventListener('wheel',event=>{
  if(!ready()||!overImage(event))return;
  event.preventDefault();
  const before=image.getBoundingClientRect();if(!before.width||!before.height)return;
  const delta=event.deltaY*(event.deltaMode===1?16:event.deltaMode===2?box.clientHeight:1);
  setZoom(Math.max(1,Math.min(8,getZoom()*Math.exp(-Math.max(-300,Math.min(300,delta))*.002))));
  resize();
  const after=image.getBoundingClientRect();
  panX+=before.left+before.width/2-(after.left+after.width/2);
  panY+=before.top+before.height/2-(after.top+after.height/2);translate();
 },{passive:false});
 box.addEventListener('dragstart',event=>event.preventDefault());
 box.addEventListener('pointerdown',event=>{
  if(event.pointerType!=='mouse'||event.button!==0||!ready()||getZoom()<=1||!overImage(event))return;
  event.preventDefault();suppressClick=false;
  drag={id:event.pointerId,x:event.clientX,y:event.clientY,left:panX,top:panY,moved:false};
  box.setPointerCapture(event.pointerId);box.classList.add('panning');
 });
 box.addEventListener('pointermove',event=>{
  if(!drag||event.pointerId!==drag.id)return;
  const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;
  panX=drag.left+dx;panY=drag.top+dy;translate();
 });
 function stop(event){
  if(!drag||event.pointerId!==drag.id)return;
  suppressClick=drag.moved;drag=null;box.classList.remove('panning');
  if(box.hasPointerCapture(event.pointerId))box.releasePointerCapture(event.pointerId);
 }
 box.addEventListener('pointerup',stop);box.addEventListener('pointercancel',stop);
 box.addEventListener('lostpointercapture',()=>{drag=null;box.classList.remove('panning')});
 box.addEventListener('click',event=>{if(suppressClick){event.preventDefault();event.stopPropagation();suppressClick=false}},true);
 return {constrain:translate,reset(){panX=0;panY=0;box.scrollLeft=0;box.scrollTop=0;translate()}};
}
const mipNavigation=mouseNavigation($('viewport'),$('mip'),()=>zoom,value=>{zoom=value},fit,()=>imageReady);
const bscanNavigation=mouseNavigation($('bscan-viewport'),$('bscan-link'),()=>bscanZoom,value=>{bscanZoom=value},fitBscan,()=>!!current?.bscan&&bscanReady);
function setButtons(){for(const button of document.querySelectorAll('[data-status]'))button.disabled=busy||!current||!imageReady||!bscanReady;$('reset').disabled=busy||!current||!imageReady||!bscanReady;syncZoomControls();$('filter').disabled=busy;for(const input of [$('note'),...$('reasons').querySelectorAll('input')])input.disabled=busy||!current;renderList()}
async function save(status){
 if(busy||!current||!imageReady)return;
 const reasons=[...$('reasons').querySelectorAll('input:checked')].map(i=>i.value);
 busy=true;setButtons();$('save-state').textContent='Gemmer…';error('');
 const item=current,before=visible(),pos=before.findIndex(i=>i.id===item.id);
 try{
  const response=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json','X-Review-Token':config.token},body:JSON.stringify({id:item.id,status,reasons,note:$('note').value,revision:state.revision})});
  const result=await response.json();if(!response.ok)throw Error(result.error||'Kunne ikke gemme');
  state.revision=result.revision;state.reviews[item.id]=result.review;dirty=false;busy=false;
  const filter=$('filter').value;
  const next=filter==='all'
   ?before.slice(pos+1).find(i=>statusOf(i)==='unreviewed')||before.slice(0,pos).find(i=>statusOf(i)==='unreviewed')
   :before.slice(pos+1).find(i=>matchesFilter(i,filter));
  if(next)select(next,true);
  else{
   const remaining=visible();
   const last=matchesFilter(item,filter)?item:before.slice(0,pos).reverse().find(i=>matchesFilter(i,filter));
   select(last||remaining[0]||null,true);
   $('save-state').textContent=filter==='all'?'Gemt · Ingen flere uvurderede i dette udvalg'
    :remaining.length?'Gemt · Sidste billede i dette udvalg':'Gemt · Ingen billeder tilbage i dette udvalg';
  }
  if(result.warning)error(result.warning);
 }catch(e){error(e.message);$('save-state').textContent='Ikke gemt';busy=false}
 setButtons();
}
$('mip').onload=()=>{imageReady=true;$('viewport').classList.remove('loading');fit();setButtons()};$('mip').onerror=()=>{imageReady=false;$('viewport').classList.remove('loading');error('Billedet kunne ikke indlæses. Filen kan være ændret; genstart programmet.');setButtons()};
for(const b of document.querySelectorAll('[data-status]'))b.onclick=()=>save(b.dataset.status);
$('reset').onclick=()=>{if(window.confirm('Nulstil vurderingen af dette billede?'))save('unreviewed')};
for(const input of [$('note'),...$('reasons').querySelectorAll('input')])input.addEventListener('input',()=>{dirty=true;$('save-state').textContent='Ændringer er ikke gemt';$('save-state').className='unsaved'});
$('previous').onclick=()=>{const items=visible(),i=items.findIndex(x=>x.id===current.id);if(i>0)select(items[i-1])};$('next').onclick=()=>{const items=visible(),i=items.findIndex(x=>x.id===current.id);if(i<items.length-1)select(items[i+1])};
$('filter').onchange=()=>{if(!confirmLeave()){$('filter').value=activeFilter;renderList();return}activeFilter=$('filter').value;const items=visible();if(!items.some(i=>i.id===current?.id))select(items[0]||null,true);else{renderList();revealCurrent()}};
$('zoom-in').onclick=()=>{zoom=Math.min(8,zoom*1.4);fit()};$('zoom-out').onclick=()=>{zoom=Math.max(1,zoom/1.4);fit()};$('fit').onclick=()=>{zoom=1;mipNavigation.reset();fit()};window.addEventListener('resize',fit);window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
let polling=false;
setInterval(async()=>{
 if(!state||polling||busy)return;
 polling=true;
 try{
  const response=await fetch('/api/state');if(!response.ok)return;
  const latest=await response.json();
  const g=latest.generation;if(g?.total)$('generation-counts').textContent=`MIP: ${g.ready} / ${g.total} klar · ${g.failed} fejl`;
  if(busy||latest.revision!==state.revision)return;
  // Refresh the queue only; leave the current image, unsaved fields and zoom intact.
  state.items=latest.items;renderList();
 }catch(e){/* The next poll retries a temporarily unavailable server. */}
 finally{polling=false}
},5000);
(async()=>{try{const r=await fetch('/api/state');if(!r.ok)throw Error('Kunne ikke hente vurderingslisten');state=await r.json();$('results-path').textContent=state.results_path;const g=state.generation;if(g?.total)$('generation-counts').textContent=`MIP: ${g.ready} / ${g.total} klar · ${g.failed} fejl`;if(config.warnings.length){$('notice').textContent=`${config.warnings.length} filer blev sprunget over. `+config.warnings.join(' · ');$('notice').style.display='block'}select(state.items.find(i=>statusOf(i)==='unreviewed')||state.items[0],true)}catch(e){error(e.message)}})();
